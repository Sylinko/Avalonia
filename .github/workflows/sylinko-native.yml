name: Build Sylinko Avalonia.Native

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed 12.2.0 package and open its feed PR
        type: boolean
        default: false
      deployment_target:
        description: Native deployment target (release baseline is 12.0)
        type: string
        default: '12.0'
      reuse_existing_release:
        description: Skip building and open or update the feed PR from an existing GitHub Release
        type: boolean
        default: false

concurrency:
  group: sylinko-native-12.2.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'Sylinko/Avalonia'
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        if: ${{ !inputs.reuse_existing_release }}
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        if: ${{ !inputs.reuse_existing_release }}
        with:
          global-json-file: global.json
      - name: Check publication identity
        if: ${{ inputs.publish || inputs.reuse_existing_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          SHOULD_PUBLISH: ${{ inputs.publish }}
          REUSE_EXISTING_RELEASE: ${{ inputs.reuse_existing_release }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYMENT_TARGET" = 12.0
          if [ "$REUSE_EXISTING_RELEASE" = "true" ]; then
            if [ "$SHOULD_PUBLISH" != "true" ]; then
              echo 'reuse_existing_release requires publish=true.' >&2
              exit 1
            fi
            if ! gh release view nuget/Avalonia.Native/12.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo 'Expected existing release nuget/Avalonia.Native/12.2.0 to reuse.' >&2
              exit 1
            fi
          fi
      - name: Build the compatibility package
        if: ${{ !inputs.reuse_existing_release }}
        env:
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
        shell: bash
        run: bash scripts/sylinko/build-native-package.sh --deployment-target "$DEPLOYMENT_TARGET"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.reuse_existing_release }}
        with:
          name: Avalonia.Native-12.2.0
          path: artifacts/sylinko-native/*
      - name: Publish reviewed package and propose feed version
        if: ${{ inputs.publish }}
        uses: Sylinko/nuget-feed@v1
        with:
          token: ${{ secrets.SYLINKO_NUGET_FEED_TOKEN }}
          release-tag: nuget/Avalonia.Native/12.2.0
          artifacts-directory: artifacts/sylinko-native
          reuse-existing-release: ${{ inputs.reuse_existing_release }}
